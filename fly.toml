app = "hisham-stocks-gateway"
primary_region = "fra"

[build]
dockerfile = "Dockerfile.gateway"

[env]
HOST = "0.0.0.0"
PORT = "4000"
FEED = "simulator"
SIM_SEED = "demo-v1"
CHAOS_SCOPE = "connection"
TRUST_PROXY = "2"
ALLOWED_ORIGINS = "https://hisham-stocks-gateway.fly.dev,https://stocks-watchlist-puce.vercel.app"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
